# Audit trail rotation for fs-readonly-mcp.
# Install: cp deploy/logrotate.conf /etc/logrotate.d/fs-readonly-mcp
#
# The app appends one NDJSON line per tool call, so this file only grows.
# Needs a leading TAB (or spaces) before each directive -- logrotate is strict.
#
# Keep this file ASCII-only: logrotate's parser is ASCII and chokes on UTF-8.
#
# copytruncate is used because the app keeps the file handle open. The service
# is stateless and a restart is harmless, but copytruncate avoids the restart.
# The create line's owner must match user= in deploy/supervisor.conf.

/var/log/fs-readonly-mcp/audit.ndjson {
    daily
    rotate 14
    size 50M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0644 www www
}
