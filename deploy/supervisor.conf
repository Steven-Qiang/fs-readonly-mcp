; fs-readonly-mcp -- supervisor program config
;
; Install:
;   cp deploy/supervisor.conf /etc/supervisor/conf.d/fs-readonly-mcp.conf
;   supervisorctl reread && supervisorctl update && supervisorctl status fs-readonly-mcp
;
; This file MUST stay pure ASCII: supervisord parses its config with Python
; configparser, which reads it as ASCII and fails on UTF-8 comments/values.
;
; Config precedence in the app: process environment > <project>/.env
; So either set MCP_* here with environment=, or keep them in /opt/fs-readonly-mcp/.env.
; Both set: environment= wins.

[program:fs-readonly-mcp]
directory=/opt/fs-readonly-mcp
command=/usr/bin/node src/server.js
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=10
stopsignal=TERM

; Run as the account that owns the app dir and can read the log dirs.
; Change www to whatever this server uses (www / nginx / deploy / root).
user=www

; Optional: set config here instead of .env (keys may be written with or
; without the MCP_ prefix; the app accepts both).
; environment=MCP_HOST="0.0.0.0",MCP_PORT="7801",MCP_TOKEN="CHANGE_ME_LONG_RANDOM",MCP_ROOTS="/srv/app-a/logs,/srv/web-logs",MCP_AUDIT_LOG="/var/log/fs-readonly-mcp/audit.ndjson"

; stdout+stderr both go to this file: startup banner, warning about missing
; token, tool errors. Auto-rotated by supervisor itself.
stdout_logfile=/var/log/fs-readonly-mcp/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

; The per-call audit trail (NDJSON, written by the app itself) goes to
; MCP_AUDIT_LOG and is rotated by logrotate -- see deploy/logrotate.conf.
;
; Health check (supervisor 4.0+). Failure only logs, it does not restart.
; healthcheck_interval=30
; healthcheck_command=/usr/bin/curl -fsS -H "Authorization: Bearer CHANGE_ME_LONG_RANDOM" http://127.0.0.1:7801/healthz
